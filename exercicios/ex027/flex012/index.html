<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: lightsalmon;
            flex-flow: row nowrap;
            display: flex;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            
        }
        
        div#cxA {
            /* flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 200px; */

            flex: 1 0 200px;
        }

        div#cxB {
            /*flex-shrink: 0;
            flex-grow: 3;
            flex-basis: 150px;*/

            flex: 3 0 150px;
        }

        div#cxC {
            /*flex-shrink: 4;
            flex-grow: 1;
            flex-basis: auto;*/

            flex: 1 4 auto;
        }

        /*
            flex: 0 1 auto;  -> valor padrão
            flex: initial -> valor padrão

            flex: 0 0 auto; -> não cresce e não encolhe
            flex: none -> não cresce e não encolhe

            flex: 1 1 auto; -> cresce e encolhe igualmente
            flex: auto -> cresce e encolhe igualmente

            flex: 3; -> flex: 3 1 auto; */
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
