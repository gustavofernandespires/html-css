<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Formulário</title>
</head>
<body>
    <h1>Testando Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <fieldset id="dpessoais">
            <legend>Dados Pessoais</legend>
                <label for="inome">Nome:</label>
                <input type="text" id="inome" name="nome" autocomplete="name" placeholder="Nome Completo" required minlength="5" maxlength="30" size="30"><br>
                <label for="isxmasc">Masculino</label>
                <input type="radio" id="isxmasc" name="sexo" value="masc" checked>
                <label for="isxfem">Feminino</label>
                <input type="radio" id="isxfem" name="sexo" value="fem"><br>
                <label for="idata">Data de Nascimento:</label>
                <input type="date" id="idata" name="data"><br>
                <label for="itel">Telefone:</label>
                <input type="tel" id="itel" name="telefone" autocomplete="tel" placeholder="(xx) xxxxx-xxxx"><br>
        </fieldset>

        <fieldset id="endereco">
            <legend>Endereço</legend>
                <label for="irua">Rua:</label>
                <input type="text" id="irua" name="rua" autocomplete="street-address" required><br>
                <label for="inum">Número:</label>
                <input type="number" id="inum" name="numero" autocomplete="cc-number" required min="1" max="10000"><br>
                <label for="ibairro">Bairro:</label>
                <input type="text" id="ibairro" name="bairro" autocomplete="neighborhood" required><br>
                <label for="icep">CEP:</label>
                <input type="text" id="icep" name="cep" autocomplete="postal-code" required pattern="^\d{8}$" minlength="8" maxlength="8" size="9"><br>
                <label for="icidade">Cidade:</label>
                <input type="text" id="icidade" name="cidade" autocomplete="address-level2" required><br>
                <label for="iestado">Estado:</label>
                <input type="text" id="iestado" name="estado" autocomplete="address-level1" required><br>
        </fieldset>

        <fieldset id="login">
                <legend>Dados de log-in</legend>
                    <label for="iemail">E-mail:</label>
                    <input type="email" id="iemail" name="email" autocomplete="email" placeholder="exemplo@dominio.com" required><br>
                    <label for="isenha">Senha:</label>
                    <input type="password" id="isenha" name="senha" autocomplete="current-password" placeholder="Senha" required><br>
    
        </fieldset>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
